name: BlessedLine Windows smoke test
on:
  push:
    branches: [main, 'revision/**']
    tags: ['v*-preview']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(startsWith(github.ref, 'refs/tags/v') && '["x64","x86"]' || '["x64"]') }}
    env:
      BLESSED_EXE: ./src/BlessedLine.Desktop/bin/Release/net10.0-windows/BlessedLine.exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.404
      - name: Build and test
        run: |
          dotnet build BlessedLine.slnx -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet test BlessedLine.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Get the downloadable package for this release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/checkout@v4
        with:
          ref: downloads
          path: release-files
          sparse-checkout: |
            /*.7z
          sparse-checkout-cone-mode: false
      - name: Test the packaged executable on release tags
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v','' -replace '-preview$',''
          $archive = "release-files/BlessedLine-$version-win-${{ matrix.arch }}.7z"
          Get-FileHash $archive -Algorithm SHA256
          & 7z x $archive -oportable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = (Resolve-Path 'portable/BlessedLine/BlessedLine.exe').Path
          "BLESSED_EXE=$exe" >> $env:GITHUB_ENV
      - name: Start the WPF application and exercise the mini panel
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $e = [System.Windows.Automation.AutomationElement]
          # Seed a quota large enough to remain active throughout the panel check.
          $profile = Join-Path $env:LOCALAPPDATA 'BlessedLine'
          New-Item $profile -ItemType Directory -Force | Out-Null
          @{ Counter = @{ Name = 'Toplam sayaç'; UsedBytes = 500000000; LimitBytes = 1000000000 } } |
              ConvertTo-Json | Set-Content (Join-Path $profile 'state.json')
          $p = Start-Process -FilePath $env:BLESSED_EXE -PassThru
          try {
              for ($i = 0; $i -lt 30; $i++) {
                  Start-Sleep -Milliseconds 500
                  $p.Refresh()
                  if ($p.HasExited) { throw "Application exited on startup with code $($p.ExitCode)." }
                  if ($p.MainWindowHandle -ne 0) { break }
              }
              if ($p.MainWindowHandle -eq 0) { throw 'BlessedLine window did not appear.' }
              $window = $e::FromHandle($p.MainWindowHandle)
              $main = $window.Current.BoundingRectangle
              if ([Math]::Abs($main.Width - $main.Height) -gt 12) { throw "Expected a square main panel, got $main." }
              $condition = [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty, 'MiniButton')
              $mini = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, $condition)
              if ($null -eq $mini) { throw 'Mini button not found.' }
              $invoke = [System.Windows.Automation.InvokePattern]::Pattern
              $mini.GetCurrentPattern($invoke).Invoke()
              Start-Sleep -Milliseconds 700
              $compact = $window.Current.BoundingRectangle
              $editor = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty, 'MiniQuotaButton'))
              if ($null -eq $editor -or $editor.Current.IsOffscreen) { throw 'Mini quota editor was not visible.' }
              $hint = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty, 'QuotaHint'))
              if ($hint.Current.Name -notlike '*kotadan*kaldı*') { throw 'The compact bar did not show remaining quota.' }
              $editor.GetCurrentPattern($invoke).Invoke()
              Start-Sleep -Milliseconds 500
              $input = $e::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty, 'LimitInput'))
              $input.GetCurrentPattern([System.Windows.Automation.ValuePattern]::Pattern).SetValue('1234,5')
              $apply = $e::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty, 'ApplyLimitButton'))
              $apply.GetCurrentPattern($invoke).Invoke()
              Start-Sleep -Milliseconds 500
              $edited = Get-Content (Join-Path $profile 'state.json') -Raw | ConvertFrom-Json
              if ($edited.Counter.LimitBytes -ne 1234500000) { throw 'Editing the mini quota did not persist.' }
              if ($compact.Width -ge $main.Width -or $compact.Height -ge $main.Height) { throw "Mini panel did not shrink, got $compact." }
              $mini.GetCurrentPattern($invoke).Invoke()
              Start-Sleep -Milliseconds 700
              $restored = $window.Current.BoundingRectangle
              if ([Math]::Abs($restored.Width - $main.Width) -gt 12) { throw 'Main panel did not return to the original width.' }
              Write-Host "BlessedLine opened and switched from $main to $compact and back."

              if ($compact.Height -gt 150) { throw "Mini bar is too tall: $compact" }
              $null = $p.CloseMainWindow()
              Start-Sleep -Milliseconds 600
              $p.Refresh()
              if ($p.HasExited -or $p.MainWindowHandle -ne 0) { throw 'Close did not hide the running application.' }
              Write-Host 'X hid the window and kept the sampler running.'
              $second = Start-Process -FilePath $p.Path -PassThru
              if (-not $second.WaitForExit(10000)) { throw 'Duplicate instance did not hand off.' }
              Start-Sleep -Seconds 1
              $p.Refresh()
              if ($p.MainWindowHandle -eq 0) { throw 'Launching again did not restore the tray window.' }
              $window = $e::FromHandle($p.MainWindowHandle)
              $settings = $window.FindFirst([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty, 'SettingsButton'))
              $settings.GetCurrentPattern($invoke).Invoke()
              Start-Sleep -Milliseconds 500
              $aero = $e::RootElement.FindFirst([System.Windows.Automation.TreeScope]::Descendants, [System.Windows.Automation.PropertyCondition]::new($e::AutomationIdProperty,'AeroThemeOption'))
              $aero.GetCurrentPattern([System.Windows.Automation.SelectionItemPattern]::Pattern).Select()
              Start-Sleep -Milliseconds 600
              $saved = Get-Content (Join-Path $env:LOCALAPPDATA 'BlessedLine/state.json') -Raw | ConvertFrom-Json
              if ($saved.Theme -ne 'Win7') { throw 'Theme change did not persist.' }
              if ($p.HasExited) { throw 'The theme switch closed the app.' }
              Write-Host 'Aero was selected and saved.'

          } finally {
              if (-not $p.HasExited) {
                  $null = $p.CloseMainWindow()
                  if (-not $p.WaitForExit(5000)) { $p.Kill() }
              }
          }
      - name: Attribute real Windows downloads to two applications
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $identity = [System.Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = [System.Security.Principal.WindowsPrincipal]::new($identity)
          if (-not $principal.IsInRole([System.Security.Principal.WindowsBuiltInRole]::Administrator)) {
              throw 'This runner is not elevated. ETW could not be exercised.'
          }
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $element = [System.Windows.Automation.AutomationElement]
          $scope = [System.Windows.Automation.TreeScope]::Descendants
          $invoke = [System.Windows.Automation.InvokePattern]::Pattern
          function ById($parent, $id) {
              $condition = [System.Windows.Automation.PropertyCondition]::new($element::AutomationIdProperty, $id)
              $parent.FindFirst($scope, $condition)
          }
          function VisibleNames($grid) {
              $names = @()
              $scroll = $null
              $pattern = [System.Windows.Automation.ScrollPattern]::Pattern
              if ($grid.TryGetCurrentPattern($pattern, [ref]$scroll) -and $scroll.Current.VerticallyScrollable) {
                  $positions = @(0, 25, 50, 75, 100)
              } else {
                  $positions = @(-1)
              }
              foreach ($position in $positions) {
                  if ($position -ge 0) {
                      $scroll.SetScrollPercent(-1, $position)
                      Start-Sleep -Milliseconds 200
                  }
                  $names += $grid.FindAll($scope, [System.Windows.Automation.Condition]::TrueCondition) |
                      ForEach-Object { $_.Current.Name }
              }
              $names
          }

          $p = Start-Process -FilePath $env:BLESSED_EXE -PassThru
          $curl = $null
          try {
              for ($i = 0; $i -lt 30; $i++) {
                  Start-Sleep -Milliseconds 500
                  $p.Refresh()
                  if ($p.HasExited) { throw "BlessedLine exited with code $($p.ExitCode)." }
                  if ($p.MainWindowHandle -ne 0) { break }
              }
              if ($p.MainWindowHandle -eq 0) { throw 'BlessedLine window did not appear.' }
              $window = $element::FromHandle($p.MainWindowHandle)
              if ((ById $window 'DetailsLabel').Current.Name -eq 'Detayı göster') { (ById $window 'DetailsButton').GetCurrentPattern($invoke).Invoke() }
              Start-Sleep -Seconds 2
              $status = (ById $window 'DetailStatus').Current.Name
              Write-Host "Application measurement status: $status"
              if ($status -notlike 'Uygulama ölçümü açık*') { throw "ETW was not running: $status" }

              $uri = 'https://raw.githubusercontent.com/microsoft/win32metadata/main/generation/WinSDK/RecompiledIdlHeaders/um/fwpmu.h'
              $curl = Start-Process curl.exe -ArgumentList @('--silent','--fail','--limit-rate','8k','--max-time','45','--output','blessed-curl-download.tmp',$uri) -PassThru
              $web = Invoke-WebRequest -Uri $uri
              if ($web.RawContentLength -lt 10000) { throw 'The PowerShell process did not download the fixture.' }
              $grid = ById $window 'Applications'
              if ($null -eq $grid) { throw 'Application details grid did not appear.' }

              for ($i = 0; $i -lt 15; $i++) {
                  Start-Sleep -Seconds 1
                  $names = @(VisibleNames $grid)
                  if ($names -contains 'curl' -and $names -contains 'PowerShell') { break }
              }
              Write-Host ('Application table names and values: ' + (($names | Where-Object { $_ }) -join ' | '))
              if ($names -notcontains 'curl' -or $names -notcontains 'PowerShell') {
                  throw 'The applications table did not show both download processes.'
              }
              if (-not ($names | Where-Object { $_ -match '^[1-9].* KB$' })) {
                  throw 'No nonzero KB-scale rate or transfer total was visible.'
              }
              $icons = $grid.FindAll($scope, [System.Windows.Automation.PropertyCondition]::new($element::ControlTypeProperty, [System.Windows.Automation.ControlType]::Image))
              if ($icons.Count -lt 2) { throw 'Application icons missing from the measured rows.' }
              Write-Host 'Real TCP traffic was attributed to curl and PowerShell.'
          } finally {
              if ($curl -and -not $curl.HasExited) { $curl.Kill() }
              if (-not $p.HasExited) {
                  $null = $p.CloseMainWindow()
                  if (-not $p.WaitForExit(5000)) { $p.Kill() }
              }
          }
      - name: Verify standard-user discovery and the ETW helper channel
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          $exe = (Resolve-Path $env:BLESSED_EXE).Path
          $uri = 'https://raw.githubusercontent.com/microsoft/win32metadata/main/generation/WinSDK/RecompiledIdlHeaders/um/fwpmu.h'
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $element = [System.Windows.Automation.AutomationElement]
          $scope = [System.Windows.Automation.TreeScope]::Descendants
          $curl = Start-Process curl.exe -ArgumentList @('--silent','--fail','--limit-rate','2k','--max-time','60','--output','blessed-standard.tmp',$uri) -PassThru
          try {
              & runas.exe /trustlevel:0x20000 "$exe"
              if ($LASTEXITCODE -ne 0) { throw 'Unable to launch with a basic user token.' }
              for ($i=0; $i -lt 25; $i++) {
                  Start-Sleep -Seconds 1
                  $p = Get-Process BlessedLine -ErrorAction SilentlyContinue | Where-Object MainWindowHandle -ne 0 | Select-Object -First 1
                  if (!$p) { continue }
                  $window = $element::FromHandle($p.MainWindowHandle)
                  $authorize = $window.FindFirst($scope,[System.Windows.Automation.PropertyCondition]::new($element::AutomationIdProperty,'AuthorizeButton'))
                  $app = $window.FindFirst($scope,[System.Windows.Automation.PropertyCondition]::new($element::NameProperty,'curl'))
                  if ($authorize -and $app) { break }
              }
              if (!$app -or !$authorize) { throw 'Connected curl did not appear before administrator approval.' }
              Write-Host 'Connected curl visible under the basic user token with elevation available.'
          } finally {
              if ($p -and !$p.HasExited) { $p.Kill(); $p.WaitForExit() }
              if (!$curl.HasExited) { $curl.Kill() }
          }
          $id = [Guid]::NewGuid().ToString('N')
          $pipe = [IO.Pipes.NamedPipeServerStream]::new("BlessedLine-$id",[IO.Pipes.PipeDirection]::In,1,[IO.Pipes.PipeTransmissionMode]::Byte,[IO.Pipes.PipeOptions]::Asynchronous)
          try {
              $worker = Start-Process $exe -ArgumentList @('--traffic',$id,$PID) -PassThru
              if (!$pipe.WaitForConnectionAsync().Wait(12000)) { throw 'Helper did not connect.' }
              $reader = [IO.StreamReader]::new($pipe)
              $bytes = 0
              for ($i=0;$i -lt 12;$i++) {
                  $null = Invoke-WebRequest $uri
                  $line = $reader.ReadLineAsync()
                  if (!$line.Wait(4000) -or !$line.Result) { throw 'Helper exited without measurements.' }
                  $batch = $line.Result | ConvertFrom-Json
                  $bytes += ($batch.Traffic | Where-Object Path -like '*\pwsh.exe' | Measure-Object -Property Received -Sum).Sum
                  if ($bytes -gt 0) { break }
              }
              if ($bytes -le 0) { throw 'No PowerShell download bytes from the helper.' }
              Write-Host "Helper reported $bytes received bytes."
          } finally {
              $pipe.Dispose()
              if ($worker -and !$worker.WaitForExit(5000)) { $worker.Kill(); throw 'Helper did not exit on pipe close.' }
          }
      - name: Open the app in all supported languages
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          $ui = [System.Windows.Automation.AutomationElement]
          $scope = [System.Windows.Automation.TreeScope]::Descendants
          $profilePath = Join-Path $env:LOCALAPPDATA 'BlessedLine/state.json'
          $country = Import-Csv src/BlessedLine.Desktop/Languages.tsv -Delimiter "`t" | Where-Object key -eq Settings
          foreach ($language in @('tr','en','zh','hi','es','ar','fr','bn','pt','ru','ur')) {
              @{ Language = $language } | ConvertTo-Json | Set-Content $profilePath
              $app = Start-Process -FilePath $env:BLESSED_EXE -PassThru
              try {
                  for ($i = 0; $i -lt 30; $i++) {
                      Start-Sleep -Milliseconds 300
                      $app.Refresh()
                      if ($app.HasExited) { throw "Failed to launch locale $language." }
                      if ($app.MainWindowHandle -ne 0) { break }
                  }
                  if ($app.MainWindowHandle -eq 0) { throw "No window for locale $language." }
                  $window = $ui::FromHandle($app.MainWindowHandle)
                  $settings = $window.FindFirst($scope, [System.Windows.Automation.PropertyCondition]::new($ui::AutomationIdProperty, 'SettingsButton'))
                  if ($settings.Current.Name -ne $country.$language) {
                      throw "Locale ${language}: expected '$($country.$language)', got '$($settings.Current.Name)'."
                  }
                  Write-Host "$language window: $($settings.Current.Name)"
              } finally {
                  if (!$app.HasExited) { $app.Kill(); $app.WaitForExit() }
              }
          }

name: Publish Windows download

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.3.0-preview)
        required: true
        default: v0.3.0-preview
      sha256:
        description: SHA-256 of the verified package on the downloads branch
        required: true
        default: 7ede62873178a5a914171dd2004be757b7d28aae61344f1d99aa05239f75bcdc

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: downloads
          persist-credentials: false
          sparse-checkout: |
            /*.7z
          sparse-checkout-cone-mode: false
      - name: Verify package and attach it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_SHA: ${{ inputs.sha256 }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-preview)?$ ]]; then
            echo "Expected a version tag such as v0.3.0-preview"
            exit 1
          fi
          package="BlessedLine-${BASH_REMATCH[1]}-win-x64.7z"
          if [[ ! "$PACKAGE_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Expected a lowercase SHA-256 digest"
            exit 1
          fi
          printf '%s  %s\n' "$PACKAGE_SHA" "$package" | sha256sum --check --strict
          gh release upload "$RELEASE_TAG" "$package" --repo "$GITHUB_REPOSITORY"

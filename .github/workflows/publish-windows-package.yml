name: Publish release downloads

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example, v0.3.0-preview)
        required: true
        default: v0.4.0-preview
      sha256:
        description: SHA-256 of the verified checksum manifest on the downloads branch
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: downloads
          persist-credentials: false
          sparse-checkout: |
            /*.7z
            /*.tar.gz
            /*.zip
            /*-SHA256SUMS.txt
          sparse-checkout-cone-mode: false
      - name: Verify and attach release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_SHA: ${{ inputs.sha256 }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-preview)?$ ]]; then
            echo "Expected a version tag such as v0.3.0-preview"
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          base="BlessedLine-$version"
          manifest="$base-SHA256SUMS.txt"
          packages=("$base-win-x64.7z" "$base-win-x86.7z" "$base-linux.tar.gz" "$base-downloads.zip")
          if [[ ! "$PACKAGE_SHA" =~ ^[a-f0-9]{64}$ ]]; then
            echo "Expected a lowercase SHA-256 digest"
            exit 1
          fi
          printf '%s  %s\n' "$PACKAGE_SHA" "$manifest" | sha256sum --check --strict
          sha256sum --check --strict "$manifest"
          gh release upload "$RELEASE_TAG" "${packages[@]}" "$manifest" --repo "$GITHUB_REPOSITORY"
